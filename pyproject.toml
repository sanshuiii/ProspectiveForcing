[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prospective-forcing"
version = "0.1.0"
description = "Two-stage long-video training and B0/A1/M1 inference for Prospective Forcing"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
